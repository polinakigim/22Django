{% extends 'blog/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                  <p class="card-text">Вы действительно хотите удалить {{ object.name }}?</p>
                    <button type="submit" class="btn btn-danger">
                        Удалить
                    </button>
                  <button type="button" class="btn btn-lg btn-block btn-outline-primary">Назад</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
